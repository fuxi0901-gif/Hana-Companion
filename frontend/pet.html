<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hana 桌宠</title>
<!-- 与 index.html 相同的 vendored 库，脚本顺序敏感 -->
<script src="/libs/pixi.min.js"></script>
<script src="/libs/live2dcubismcore.min.js"></script>
<script src="/libs/pixi-live2d-display-cubism4.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    user-select: none;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  #stage-canvas { position: fixed; inset: 0; z-index: 0; }

  /* 常驻对话记录：悬在角色上方，可滚动、保留历史、完整显示回复 */
  #chat {
    position: fixed; z-index: 10;
    left: 4px; right: 4px; top: 6px;
    max-height: 48vh;
    display: none; flex-direction: column; gap: 5px;
    overflow-y: auto; overscroll-behavior: contain;
    background: rgba(255, 255, 255, 0.9);
    border: 1px solid rgba(244, 143, 177, 0.55);
    border-radius: 14px;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.18);
    padding: 8px 10px;
    font-size: 13px; line-height: 1.45; color: #4a2b3a;
    scrollbar-width: thin;
  }
  #chat.show { display: flex; }
  #chat::-webkit-scrollbar { width: 6px; }
  #chat::-webkit-scrollbar-thumb { background: rgba(224, 106, 148, 0.45); border-radius: 3px; }
  #chat .msg {
    align-self: flex-start; max-width: 96%;
    padding: 5px 8px; border-radius: 10px;
    white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere;
    background: rgba(248, 224, 234, 0.9);
  }
  #chat .msg.me { align-self: flex-end; background: rgba(210, 232, 255, 0.95); }
  #chat .msg.sys { align-self: center; background: transparent; color: #8a6b78; font-size: 11px; padding: 1px 4px; }
  #chat .msg.err { align-self: center; background: rgba(240, 210, 210, 0.92); color: #8c2f2f; font-size: 12px; }
  #chat .msg .tag { display: block; font-size: 10px; color: #b07f93; margin-bottom: 1px; }

  /* 关闭对话框的小按钮：贴在对话记录右上角（不放进 #chat，避免被消息裁剪掉） */
  #chatClose {
    position: fixed; z-index: 12;
    right: 8px; top: 9px;
    width: 20px; height: 20px; line-height: 19px;
    border: none; border-radius: 50%; padding: 0;
    background: rgba(224, 106, 148, 0.92); color: #fff;
    font-size: 13px; cursor: pointer; display: none;
  }
  #chatClose.show { display: block; }
  #chatClose:hover { background: #e06a94; }

  /* 嘴边气泡：台词从角色嘴里说出，尾巴指向嘴的位置 */
  #bubble {
    position: fixed; z-index: 13;
    left: 4px; top: 4px;
    max-width: calc(100% - 8px);
    max-height: 46vh;
    display: none;
    overflow-y: auto; overscroll-behavior: contain;
    background: rgba(255, 255, 255, 0.96);
    border: 1px solid rgba(244, 143, 177, 0.6);
    border-radius: 14px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18);
    padding: 8px 11px;
    font-size: 13.5px; line-height: 1.5; color: #4a2b3a;
    white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere;
    scrollbar-width: thin;
    opacity: 0; transition: opacity .22s;
  }
  #bubble.show { display: block; }
  #bubble.in { opacity: 1; }
  #bubble::-webkit-scrollbar { width: 6px; }
  #bubble::-webkit-scrollbar-thumb { background: rgba(224, 106, 148, 0.45); border-radius: 3px; }
  #bubble::after {
    content: "";
    position: absolute;
    left: var(--tail-x, 50%);
    top: 100%;
    margin-left: -8px;
    border: 8px solid transparent;
    border-top-color: rgba(255, 255, 255, 0.96);
    border-bottom: 0;
  }
  #bubble.no-tail::after { display: none; }

  /* 状态角标（连接/思考/说话/工具） */
  #petStatus {
    position: fixed; z-index: 11;
    left: 8px; top: 8px;
    font-size: 11px; color: #e06a94;
    background: rgba(255, 255, 255, 0.8);
    border-radius: 8px; padding: 1px 6px;
    opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  #petStatus.show { opacity: 1; }


  /* 底部输入行 */
  #input-row {
    position: fixed; z-index: 11;
    left: 4px; right: 4px; bottom: 4px;
    display: none; gap: 6px;
  }
  #input-row.open { display: flex; }
  #textInput {
    flex: 1; min-width: 0;
    border: 1px solid rgba(244, 143, 177, 0.7);
    border-radius: 10px; padding: 6px 10px;
    font-size: 13px; outline: none;
    background: rgba(255, 255, 255, 0.95);
  }
  #textInput:focus { border-color: #e06a94; }
  .pbtn {
    border: none; border-radius: 10px;
    padding: 6px 10px; font-size: 13px; cursor: pointer;
    background: #f4c0d3; color: #4a2b3a; white-space: nowrap;
  }
  .pbtn:hover { background: #ef9fc0; }
  .pbtn.mic-hold { background: #7ecb92; }
  .pbtn.close { background: #ddd; }

  /* 名字牌 */
  #nameTag {
    position: fixed; z-index: 9;
    left: 50%; bottom: 8px; transform: translateX(-50%);
    background: rgba(74, 43, 58, 0.75); color: #fff;
    font-size: 12px; padding: 3px 12px; border-radius: 20px;
    opacity: 0; transition: opacity .3s; pointer-events: none;
    max-width: 90%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #nameTag.show { opacity: 1; }
</style>
</head>
<body>
<canvas id="stage-canvas"></canvas>

<div id="chat" aria-live="polite"></div>
<div id="bubble" aria-live="polite"></div>
<button id="chatClose" title="隐藏对话框（右键桌宠可再次显示）" aria-label="隐藏对话框">✕</button>
<div id="petStatus"></div>

<div id="input-row">
  <input id="textInput" type="text" placeholder="和我说点什么…（Enter 发送）" />
  <button class="pbtn mic-hold" id="btnMic" title="按住说话，松开发送">🎤</button>
  <button class="pbtn" id="btnSend">发送</button>
  <button class="pbtn close" id="btnCloseInput">✕</button>
</div>

<div id="nameTag"></div>

<script>
"use strict";
/* ============================================================
   Hana 桌宠渲染层 — 仅使用后端已有 /client-ws 协议，
   不修改网页版 (index.html / app.js) 的任何行为。
   ============================================================ */
const $ = (s) => document.querySelector(s);
const chatEl = $("#chat"), chatCloseEl = $("#chatClose"), statusEl = $("#petStatus"), nameTagEl = $("#nameTag");
const bubbleEl = $("#bubble");
const pet = window.hanaPet || null; // Electron preload 注入；浏览器直开时为 null

const state = {
  connected: false, speaking: false, thinking: false, muted: false,
  heardText: "", modelInfo: null, confName: "", confUid: "", clientUid: "",
  modelScale: 1, dragging: false,
  historyUid: null, histEstablishedFor: "", // 会话历史（与网页合并用）
  chatVisible: true, // 常驻对话记录是否显示（✕ / 右键菜单 / 设置页可关）
  bubbleMode: true, // 回复以嘴边气泡说出（关闭则只用上方对话记录）
  voiceReply: true, // 语音回复：false 时只出文字、不播放 TTS 音频
};

/* ---------------- 常驻对话记录 ---------------- */
const MAX_MSG = 60;
let curAi = null, curAiText = "";

function chatNearBottom() {
  return chatEl.scrollHeight - chatEl.scrollTop - chatEl.clientHeight < 24;
}
function chatScrollToBottom() { chatEl.scrollTop = chatEl.scrollHeight; }

function pushMsg(kind, text, opts = {}) {
  if (!text && !opts.allowEmpty) return null;
  const stick = chatNearBottom() || kind === "me";
  const div = document.createElement("div");
  div.className = "msg" + (kind ? " " + kind : "");
  if (opts.tag) { const t = document.createElement("span"); t.className = "tag"; t.textContent = opts.tag; div.appendChild(t); }
  const body = document.createElement("span");
  body.textContent = text;
  div.appendChild(body);
  chatEl.appendChild(div);
  while (chatEl.children.length > MAX_MSG) chatEl.removeChild(chatEl.firstChild);
  syncChatChrome();
  if (stick) chatScrollToBottom();
  return div;
}

function chatHasContent() { return chatEl.children.length > 0; }

/* Show the log + its close button only when the user has it switched on and
   there is something to show. */
function syncChatChrome() {
  const show = state.chatVisible && chatHasContent();
  chatEl.classList.toggle("show", show);
  chatCloseEl.classList.toggle("show", show);
}

// Full rebuild — only for a conversation switch, never for an ordinary update.
function renderConversation(messages) {
  endAi();
  chatEl.innerHTML = "";
  let lastAi = "";
  for (const m of messages) {
    if (m.role === "human") pushMsg("me", m.content || "");
    else if (m.role === "ai") {
      pushMsg("ai", m.content || "", { tag: m.name || state.confName || "Hana" });
      lastAi = m.content || "";
    } else if (m.role === "system") pushMsg("sys", m.content || "");
  }
  syncChatChrome();
  chatScrollToBottom();
  if (lastAi) { setBubbleText(lastAi); scheduleBubbleHide(); }
  else resetBubble();
}

/* Incremental mirror. chat_history trails what is on screen (a turn is written when
   playback is acked), so rebuilding from it on every poll used to erase the reply
   that had just been shown. Append the new tail instead, and skip the messages this
   client already displayed itself. */
const normText = (s) => String(s == null ? "" : s).replace(/\s+/g, "");
const localSeen = new Set();
let pendingLocalTail = 0;

function noteLocal(role, text) {
  const t = normText(text);
  if (!t) return;
  if (localSeen.size > 300) localSeen.clear();
  localSeen.add(role + "|" + t);
}

// This client's turn is over: the file gained its own (human, ai) pair.
function noteLocalTurnEnd() { pendingLocalTail = 2; }

// 这条记录是否已经显示在屏幕上？气泡里是 TTS 清洗后的文本，文件里是原始回复，
// 所以任一侧包含另一侧就算已显示。
function domHasMessage(kind, text) {
  const t = normText(text);
  if (!t) return false;
  const rows = [...chatEl.querySelectorAll(".msg." + kind)].slice(-8);
  return rows.some((r) => {
    const x = normText(r.lastChild ? r.lastChild.textContent : "");
    return x.length >= 4 && t.length >= 4 && (x.includes(t) || t.includes(x));
  });
}

function localTailCount(messages) {
  if (pendingLocalTail <= 0) return 0;
  const n = messages.length;
  const last = messages[n - 1];
  if (last.role !== "ai") {
    // Only our question is written so far, and it is on screen: claim it so the
    // answer cannot be appended as a second question in the next poll.
    if (pendingLocalTail >= 2 && last.role === "human" && domHasMessage("me", last.content)) {
      pendingLocalTail = 1;
    }
    return 0;
  }
  if (!domHasMessage("ai", last.content)) {
    pendingLocalTail = 0; // 回复没上屏，让镜像把它补出来
    return 0;
  }
  if (pendingLocalTail >= 2 && n >= 2 && messages[n - 2].role === "human" &&
      domHasMessage("me", messages[n - 2].content)) return 2;
  return 1;
}

function appendMirrorMessage(m) {
  const role = m.role === "human" ? "me" : m.role === "ai" ? "ai" : "sys";
  const t = normText(m.content);
  if ((role === "me" || role === "ai") && localSeen.has(role + "|" + t)) return;
  if (role === "me") pushMsg("me", m.content || "");
  else if (role === "ai") {
    pushMsg("ai", m.content || "", { tag: m.name || state.confName || "Hana" });
    // 网页端问出来的回答也要从桌宠嘴里说出来，否则它看起来像没同步。
    setBubbleText(m.content || "");
    scheduleBubbleHide();
  }
  else pushMsg("sys", m.content || "");
  // What is on screen counts as seen, so an overlapping poll cannot repeat it.
  noteLocal(role, t);
}

function syncConversation(messages) {
  if (!Array.isArray(messages) || messages.length === 0) return; // never blank a live chat
  if (mirrorCount > 0 && (messages.length < mirrorCount || state.historyUid !== mirrorUid)) {
    renderConversation(messages);
    mirrorCount = messages.length;
    mirrorUid = state.historyUid;
    localSeen.clear();
    pendingLocalTail = 0;
    return;
  }
  mirrorUid = state.historyUid;
  const skip = localTailCount(messages);
  const end = messages.length - skip;
  if (skip > 0) pendingLocalTail = 0;
  endAi(); // the merged live bubble is now part of the record
  if (end > mirrorCount) {
    for (const m of messages.slice(mirrorCount, end)) appendMirrorMessage(m);
    lastTurnTs = Date.now(); // the other client just finished a turn; keep the pointer quiet
  }
  mirrorCount = messages.length;
  syncChatChrome();
  if (chatNearBottom()) chatScrollToBottom();
}

function setChatVisible(v, persist) {
  state.chatVisible = !!v;
  syncChatChrome();
  if (persist) patchPetSettings({ chatVisible: state.chatVisible });
}

/* ---------------- 嘴边气泡 ---------------- */
let bubbleHideTimer = 0;

/* 嘴的屏幕坐标：Live2D 包围框顶部往下约 18%（头部下缘）。各模型的嘴并没有统一的
   参数坐标可读，用包围框比例定位，拿不到模型时退回窗口上部。 */
function bubbleAnchor() {
  const W = window.innerWidth, H = window.innerHeight;
  if (live2dModel) {
    const gb = live2dModel.getBounds();
    if (isFinite(gb.width) && gb.width > 0 && isFinite(gb.height) && gb.height > 0) {
      return { x: gb.x + gb.width / 2, y: gb.y + Math.min(gb.height * 0.18, H * 0.34) };
    }
  }
  return { x: W / 2, y: H * 0.2 };
}

function positionBubble() {
  if (!state.bubbleMode || !bubbleEl.classList.contains("show")) return;
  const a = bubbleAnchor();
  const w = bubbleEl.offsetWidth, h = bubbleEl.offsetHeight;
  const left = Math.max(4, Math.min(a.x - w / 2, window.innerWidth - w - 4));
  const top = Math.max(4, a.y - 18 - h);
  bubbleEl.style.left = left + "px";
  bubbleEl.style.top = top + "px";
  bubbleEl.style.setProperty("--tail-x", Math.max(16, Math.min(a.x - left, w - 16)) + "px");
  bubbleEl.classList.toggle("no-tail", top + h > a.y - 8); // 盖住脸时尾巴反而奇怪，收掉
}

function setBubbleText(text) {
  if (!state.bubbleMode || !text) return;
  clearTimeout(bubbleHideTimer);
  // 逐句追加时始终贴到最新一行，除非用户自己往上翻过
  const stick = !bubbleEl.classList.contains("show") ||
    bubbleEl.scrollTop + bubbleEl.clientHeight >= bubbleEl.scrollHeight - 24;
  bubbleEl.textContent = text;
  bubbleEl.classList.add("show");
  positionBubble();
  if (stick) bubbleEl.scrollTop = bubbleEl.scrollHeight;
  requestAnimationFrame(() => bubbleEl.classList.add("in"));
}

function resetBubble() {
  clearTimeout(bubbleHideTimer);
  bubbleEl.textContent = "";
  bubbleEl.classList.remove("in", "show");
}

function hideBubble(now) {
  clearTimeout(bubbleHideTimer);
  bubbleEl.classList.remove("in");
  if (now) { bubbleEl.classList.remove("show"); return; }
  setTimeout(() => { if (!bubbleEl.classList.contains("in")) bubbleEl.classList.remove("show"); }, 260);
}

// 读完再收：文本越长停留越久（上限 20 秒），说话或思考期间不收。
function scheduleBubbleHide() {
  if (!state.bubbleMode || state.speaking || state.thinking) return;
  clearTimeout(bubbleHideTimer);
  const ms = Math.min(20000, 6000 + bubbleEl.textContent.length * 90);
  bubbleHideTimer = setTimeout(() => {
    if (!state.speaking && !state.thinking) hideBubble();
  }, ms);
}

function setBubbleMode(v, persist) {
  state.bubbleMode = !!v;
  if (!state.bubbleMode) {
    resetBubble();
    // 气泡关掉后对话记录就是唯一的显示面，别让它同时是隐藏的（否则回复看不见）。
    if (!state.chatVisible) setChatVisible(true, true);
  } else if (curAiText) setBubbleText(curAiText);
  if (persist) patchPetSettings({ bubbleMode: state.bubbleMode });
}

function setVoiceReply(v, persist) {
  state.voiceReply = !!v;
  if (!state.voiceReply) stopAllAudio(); // 立刻闭嘴，后面的句子只出文字
  if (persist) patchPetSettings({ voiceReply: state.voiceReply });
}


// AI 回复：本轮的所有句子合并进同一条消息，完整显示、不截断。
function beginAi() { curAi = null; curAiText = ""; resetBubble(); }
function ensureAi(name) {
  if (!curAi) curAi = pushMsg("ai", "", { tag: name || state.confName || "Hana", allowEmpty: true });
  return curAi;
}
function appendToAi(text, name) {
  if (!text) return;
  const el = ensureAi(name);
  curAiText += (curAiText ? "" : "") + text;
  const body = el.lastChild;
  body.textContent = curAiText;
  setBubbleText(curAiText); // 同一个文本同时从嘴里说出来
  if (chatNearBottom()) chatScrollToBottom();
}
function endAi() { curAi = null; curAiText = ""; scheduleBubbleHide(); }

function setStatus(tag) {
  statusEl.textContent = tag || "";
  statusEl.classList.toggle("show", !!tag);
}

function showNameTag() {
  if (!state.confName) return;
  nameTagEl.textContent = state.confName;
  nameTagEl.classList.add("show");
  clearTimeout(showNameTag._t);
  showNameTag._t = setTimeout(() => nameTagEl.classList.remove("show"), 2500);
}

/* ---------------- WebSocket ---------------- */
let ws = null, wsRetry = 1000, heartbeatTimer = null, pendingConfig = null;
function connectWS() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/client-ws`);
  ws.onopen = () => {
    state.connected = true; wsRetry = 1000;
    setStatus("已连接");
    clearInterval(heartbeatTimer);
    heartbeatTimer = setInterval(() => wsSend({ type: "heartbeat" }), 25000);
    if (pendingConfig) { const f = pendingConfig; pendingConfig = null; wsSend({ type: "switch-config", file: f }); }
  };
  ws.onmessage = (e) => {
    try { routeMessage(JSON.parse(e.data)); } catch (err) { console.error(err); }
  };
  ws.onclose = () => {
    state.connected = false;
    clearInterval(heartbeatTimer);
    setStatus("重连中…");
    stopAllAudio();
    // Re-establish the shared conversation on the next hello after reconnect.
    state.histEstablishedFor = "";
    setTimeout(connectWS, wsRetry);
    wsRetry = Math.min(wsRetry * 2, 10000);
  };
  ws.onerror = () => { try { ws.close(); } catch {} };
}
function wsSend(obj) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
}

let backendSynthDone = false;
function routeMessage(p) {
  switch (p.type) {
    case "set-model-and-conf":
      state.confName = p.conf_name || "";
      // Only the hello message carries client_uid; the reply to a
      // switch-config does not, so never clear what we already learned.
      if (p.client_uid) state.clientUid = p.client_uid;
      lastModelInfo = p.model_info;
      // A character change lands us on a different chat_history namespace, so the
      // shared conversation must be re-established for the new conf_uid.
      if (p.conf_uid && p.conf_uid !== state.confUid) {
        state.confUid = p.conf_uid;
        state.histEstablishedFor = "";
      }
      if (modelOverride && !Object.keys(skinsByName).length) {
        refreshSkins().then(() => loadLive2DModel(resolveModel(lastModelInfo)));
      } else {
        loadLive2DModel(resolveModel(lastModelInfo));
      }
      establishHistory();
      break;
    case "audio":
      enqueueAudio(p);
      break;
    case "control":
      onControl(p.text);
      break;
    case "full-text":
      if (p.text === "Thinking..." || p.text === "AI wants to speak something...") {
        setThinking(true);
      } else if (p.text && p.text !== "Connection established") {
        pushMsg("sys", p.text);
      }
      break;
    case "user-input-transcription":
      beginAi();
      noteLocal("me", p.text);
      pushMsg("me", p.text);
      setThinking(true);
      break;
    case "backend-synth-complete":
      backendSynthDone = true;
      maybePlaybackComplete();
      break;
    case "force-new-message":
      break;
    case "new-history-created":
      state.historyUid = p.history_uid || null;
      publishSharedHistory();
      break;
    case "history-data":
      // We merge into an existing shared conversation; the past turns are already
      // in the LLM memory (shared engine), so no need to replay them into the log.
      break;
    case "config-switched":
      pushMsg("sys", "已切换角色：" + (state.confName || ""));
      break;
    case "error":
      setThinking(false);
      endAi();
      {
        const msg = friendlyError(p.message);
        pushMsg("err", msg);
        setBubbleText(msg);
        scheduleBubbleHide();
      }
      break;
    case "tool_call_status":
      if (p.status === "running") { setThinking(true); setStatus("工具：" + (p.tool_name || "")); }
      break;
    case "heartbeat-ack":
    case "group-update":
    default:
      break;
  }
}

// The raw server errors are noisy/technical; show the user something readable.
function friendlyError(msg) {
  const m = (msg || "").trim();
  if (!m || m === "Conversation error:") return "刚才的回答中断了，可以再问我一次";
  if (/Invalid configuration file path/i.test(m)) return "角色切换失败：配置无效";
  if (/AI brain not set up/i.test(m)) return "还没配置大模型，请先在设置里填写";
  if (/Voice input is unavailable/i.test(m)) return "语音输入不可用，请打字";
  return m.slice(0, 120);
}

function onControl(text) {
  switch (text) {
    case "conversation-chain-start":
      state.heardText = "";
      backendSynthDone = false;
      lastTurnTs = Date.now();
      beginAi();
      setThinking(true);
      break;
    case "conversation-chain-end":
      lastTurnTs = Date.now();
      endAi();
      setThinking(false);
      maybePlaybackComplete();
      break;
    case "interrupt":           // 服务端 VAD 检测到用户插话
      stopAllAudio();
      endAi();
      setThinking(false);
      break;
    case "mic-audio-end":       // VAD 模式提示说完了
      break;
    default:
      break;
  }
}

function setThinking(on) {
  state.thinking = on;
  if (on) { setStatus("思考中…"); }
  else if (!state.speaking) { setStatus(state.connected ? "" : "重连中…"); }
}

/* 播放队列排空后回给后端 frontend-playback-complete，释放会话链 */
function maybePlaybackComplete() {
  if (backendSynthDone && !state.speaking && audioQueue.length === 0 && !playingSource) {
    backendSynthDone = false;
    lastTurnTs = Date.now();
    noteLocalTurnEnd(); // 这条回复已经在本机显示过，镜像不再重复渲染
    noteLocal("ai", state.heardText);
    wsSend({ type: "frontend-playback-complete" });
    scheduleBubbleHide(); // 说完了，气泡留一会儿给人读
  }
}

/* ---------------- Live2D 渲染 ---------------- */
let pixiApp = null, live2dModel = null, modelUrl = null, mouthVolume = 0, layoutFrame = 0;
let lastModelInfo = null, modelOverride = "", skinsByName = {};

/* 桌宠专属形象：只替换本地渲染用的模型，聊天人设仍由后端角色配置决定 */
async function refreshSkins() {
  try {
    const res = await fetch("/api/pet/skins");
    const j = await res.json();
    skinsByName = {};
    (j.skins || []).forEach((m) => { if (m && m.name) skinsByName[m.name] = m; });
  } catch { /* 后端未就绪，稍后会随 set-model-and-conf 再试 */ }
}

function resolveModel(info) {
  if (modelOverride && skinsByName[modelOverride]) return skinsByName[modelOverride];
  return info;
}

function applyModelOverride(name) {
  modelOverride = name || "";
  if (!lastModelInfo) return;
  if (modelOverride && !skinsByName[modelOverride]) refreshSkins().then(() => loadLive2DModel(resolveModel(lastModelInfo)));
  else loadLive2DModel(resolveModel(lastModelInfo));
}

function initPixi() {
  const forceRes = /[?&]res1=1/.test(location.search) ? 1 : Math.min(window.devicePixelRatio || 1, 2);
  pixiApp = new PIXI.Application({
    view: $("#stage-canvas"),
    backgroundAlpha: 0,
    autoDensity: true,
    resolution: forceRes,
    resizeTo: window,
  });
  window.addEventListener("resize", () => { layoutModel(); layoutFrame = 1; });
  if (/[?&]debug=1/.test(location.search)) {
    window.__dbgG = new PIXI.Graphics();
    pixiApp.stage.addChild(window.__dbgG);
  }
}

async function loadLive2DModel(modelInfo) {
  if (!modelInfo || !modelInfo.url || !window.PIXI?.live2d) return;
  if (modelUrl === modelInfo.url && live2dModel) { layoutModel(); return; }
  modelUrl = modelInfo.url;
  state.modelInfo = modelInfo;
  try {
    const model = await PIXI.live2d.Live2DModel.from(modelInfo.url);
    if (live2dModel) { pixiApp.stage.removeChild(live2dModel); live2dModel.destroy(); }
    live2dModel = model;
    pixiApp.stage.addChild(model);
    layoutFrame = 1;
    model.internalModel.on("beforeModelUpdate", onBeforeModelUpdate);
    model.on("hit", onModelHit);
    layoutModel();
    // 进场先放一段待机动作，让桌宠"活"起来
    const idle = (modelInfo.idleMotionGroupName || "").split(",")[0].trim();
    if (idle) { try { model.motion(idle); } catch {} }
  } catch (err) {
    console.error("[pet] Live2D load failed:", err);
    pushMsg("err", "模型加载失败：" + (modelInfo.name || ""));
  }
}

function layoutModel() {
  if (!live2dModel || !pixiApp) return;
  const W = pixiApp.renderer.width / pixiApp.renderer.resolution;
  const H = pixiApp.renderer.height / pixiApp.renderer.resolution;
  const b = live2dModel.getLocalBounds();
  if (!isFinite(b.width) || b.width <= 0 || !isFinite(b.height) || b.height <= 0) return;
  const s = Math.min((H * 0.94) / b.height, (W * 0.92) / b.width) * (state.modelScale || 1);
  live2dModel.scale.set(s);
  live2dModel.x = W / 2 - (b.x + b.width / 2) * s;
  live2dModel.y = H * 0.995 - (b.y + b.height) * s; // 脚底贴住窗口下沿
  positionBubble(); // 嘴的位置随尺寸/形象一起变
}

function onBeforeModelUpdate() {
  const cm = live2dModel.internalModel.coreModel;
  if (mouthVolume > 0) {
    cm.addParameterValueById("ParamMouthOpenY", mouthVolume);
    cm.addParameterValueById("ParamA", mouthVolume);
    cm.addParameterValueById("ParamMouthOpen", mouthVolume);
  }
  if (layoutFrame > 0 && ++layoutFrame === 6) { layoutModel(); layoutFrame = 0; }
}

let suppressHitUntil = 0;
function onModelHit() {
  if (performance.now() < suppressHitUntil) return; // 刚拖拽完，不算点击
  showNameTag();
  const taps = (state.modelInfo && state.modelInfo.tapMotions) || {};
  for (const key of Object.keys(taps)) {
    const g = taps[key];
    for (const groupName of Object.keys(g)) {
      try { live2dModel.motion(groupName, g[groupName]); } catch {}
      return;
    }
  }
}

function applyActions(actions) {
  const exprs = actions && Array.isArray(actions.expressions) ? actions.expressions : null;
  if (live2dModel && exprs && exprs.length) {
    try { live2dModel.expression(exprs[0]); } catch {}
  }
}

/* ---------------- 音频播放 + 口型 ---------------- */
let audioCtx = null;
const audioQueue = [];
let playingSource = null, playStartAt = 0, playVolumes = [], playSliceMs = 20,
    playRaf = 0, playEndResolve = null;

function ensureAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
  return audioCtx;
}
["pointerdown", "keydown"].forEach((ev) =>
  window.addEventListener(ev, () => { if (audioCtx) ensureAudioCtx(); }, { passive: true }));

function base64ToArrayBuffer(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes.buffer;
}

function enqueueAudio(payload) {
  // Show the reply text as soon as the payload arrives instead of when its audio
  // comes off the queue: waiting for playback made the pet crawl while the web
  // chat typed out the same answer at generation speed.
  const display = payload.display_text || {};
  const text = display.text || "";
  if (text) {
    setThinking(false);
    state.heardText += (state.heardText ? " " : "") + text;
    noteLocal("ai", text);
    appendToAi(text, display.name || state.confName || "Hana");
  }
  audioQueue.push(payload);
  if (!state.speaking) playNextAudio();
}

function playNextAudio() {
  const p = audioQueue.shift();
  if (!p) {
    state.speaking = false;
    setStatus(state.thinking ? "思考中…" : "");
    maybePlaybackComplete();
    return;
  }
  state.speaking = true;
  setThinking(false);
  setStatus("说话中");

  applyActions(p.actions);

  const text = (p.display_text && p.display_text.text) || "";
  const canPlay = p.audio && !state.muted && state.voiceReply;
  if (canPlay) {
    // 解码/播放任何一步失败都必须继续排空队列，否则 state.speaking 卡在 true、
    // 播放回执永远发不出去，后端会话链也就永远收不了尾。
    playAudioPayload(p).catch((e) => console.error("[pet] playback failed", e))
      .then(() => playNextAudio());
  } else {
    setTimeout(() => playNextAudio(), Math.min(1200, 300 + text.length * 40));
  }
}

async function playAudioPayload(p) {
  const ctx = ensureAudioCtx();
  // 自动播放策略下 AudioContext 会停在 suspended：请求恢复一次，恢复不了也照样
  // 靠下面的看门狗把队列排空，不会卡住会话。
  if (ctx.state === "suspended") { try { ctx.resume(); } catch {} }
  let audioBuffer;
  try {
    // decodeAudioData 返回 Promise：不 await 就会把 Promise 当 AudioBuffer 赋给
    // src.buffer 当场抛错，整条播放队列卡死（桌宠"特别慢 / 中断"的真正原因）。
    audioBuffer = await ctx.decodeAudioData(base64ToArrayBuffer(p.audio));
  } catch (err) {
    console.error("[pet] decode audio failed", err);
    return;
  }
  playVolumes = p.volumes || [];
  playSliceMs = p.slice_length || 20;

  return new Promise((resolve) => {
    const src = ctx.createBufferSource();
    const gain = ctx.createGain();
    gain.gain.value = 1;
    src.buffer = audioBuffer;
    src.connect(gain).connect(ctx.destination);
    playingSource = src;
    playStartAt = performance.now();
    playEndResolve = resolve;

    /* onended is the normal exit, but it never fires while the context is
       suspended (no user gesture yet, autoplay locked): the queue then stalled
       forever, state.speaking stayed true, the playback ack was never sent and the
       whole turn hung — which is what looked like "回答中断 / 特别慢". A watchdog on
       the known buffer length guarantees the queue drains. */
    const finish = () => {
      if (playEndResolve !== resolve) return;
      cleanupPlayback();
      try { src.stop(); } catch {}
      resolve();
    };
    const paceMs = audioBuffer.duration * 1000;
    const watchdog = setTimeout(finish, ctx.state === "running" ? paceMs + 2000 : Math.min(paceMs, 1200) + 400);
    src.onended = () => { clearTimeout(watchdog); finish(); };

    const tick = () => {
      if (!playingSource) return;
      const idx = Math.floor((performance.now() - playStartAt) / playSliceMs);
      mouthVolume = playVolumes.length ? (playVolumes[idx] ?? 0) : 0;
      playRaf = requestAnimationFrame(tick);
    };
    playRaf = requestAnimationFrame(tick);

    src.start();
  });
}

function cleanupPlayback() {
  cancelAnimationFrame(playRaf);
  playRaf = 0;
  playingSource = null;
  playEndResolve = null;
  mouthVolume = 0;
}

function stopAllAudio() {
  audioQueue.length = 0;
  if (playingSource) {
    const s = playingSource;
    const settle = playEndResolve;
    cleanupPlayback();
    try { s.stop(); } catch {}
    if (settle) settle();
  }
  state.speaking = false;
}

function interruptIfSpeaking() {
  if (!state.speaking) return;
  wsSend({ type: "interrupt-signal", text: state.heardText });
  stopAllAudio();
}

/* ---------------- 麦克风（按住说话，16kHz float，与网页版一致） ---------------- */
let micStream = null, micCtx = null, micProc = null, micActive = false;

function downsample(buffer, fromRate, toRate) {
  if (fromRate === toRate) return buffer;
  const ratio = fromRate / toRate;
  const outLen = Math.floor(buffer.length / ratio);
  const result = new Float32Array(outLen);
  for (let i = 0; i < outLen; i++) {
    const start = Math.floor(i * ratio);
    const end = Math.min(Math.floor((i + 1) * ratio), buffer.length);
    let sum = 0;
    for (let j = start; j < end; j++) sum += buffer[j];
    result[i] = sum / Math.max(end - start, 1);
  }
  return result;
}

async function startMic() {
  if (micActive) return;
  if (!state.connected) { pushMsg("err", "后端未连接"); return; }
  interruptIfSpeaking();
  try {
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
    });
  } catch {
    pushMsg("err", "麦克风权限被拒绝");
    return;
  }
  micActive = true;
  micCtx = new (window.AudioContext || window.webkitAudioContext)();
  const src = micCtx.createMediaStreamSource(micStream);
  micProc = micCtx.createScriptProcessor(4096, 1, 1);
  const muteGain = micCtx.createGain();
  muteGain.gain.value = 0;
  micProc.onaudioprocess = (e) => {
    if (!micActive) return;
    const out = downsample(e.inputBuffer.getChannelData(0), micCtx.sampleRate, 16000);
    wsSend({ type: "mic-audio-data", audio: Array.from(out) });
  };
  src.connect(micProc);
  micProc.connect(muteGain);
  muteGain.connect(micCtx.destination);
  setStatus("聆听中…按住🎤");
}

function stopMic() {
  if (!micActive) return;
  micActive = false;
  try { micProc && micProc.disconnect(); } catch {}
  try { micStream && micStream.getTracks().forEach((t) => t.stop()); } catch {}
  try { micCtx && micCtx.close(); } catch {}
  micProc = null; micStream = null; micCtx = null;
  wsSend({ type: "mic-audio-end" });
  setThinking(true);
}

const inputRow = $("#input-row"), textInput = $("#textInput");

/* 角色 / 形象切换（来自主进程的右键菜单、桌宠设置或网页角色同步） */
let requestedConfig = "conf.yaml";
function requestConfig(file) {
  if (!file) return;
  requestedConfig = file;
  if (ws && ws.readyState === WebSocket.OPEN) wsSend({ type: "switch-config", file });
  else pendingConfig = file; // 连接建立后补发
}

/* 跟随网页角色：网页版换了人物，桌宠同步换（形象、性格、记忆都来自同一份角色
   配置）。服务端只读地报告各会话当前使用的角色文件，exclude 传桌宠自己的
   client_uid；只有两边不一致才补发 switch-config，并对已发出的请求去重，避免
   轮询期间反复重载模型。跟随结果写回 settings.json，让「桌宠当前角色」始终为真。
   比较用签名而不只是文件名：改人设或换形象可能只动内容不换文件。 */
let followedSig = "", reportedUid = "";
const charSignature = (c) =>
  c ? `${c.filename || ""}|${c.conf_name || ""}|${c.live2d_model_name || ""}` : "";
function patchPetSettings(body) {
  fetch("/api/pet/settings", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
    cache: "no-store",
  }).catch(() => {});
}

/* ---------------- 与网页合并同一段对话 ----------------
   桌宠默认复用 settings.sharedHistoryUid 指向的会话：网页说的话这里能看到、
   这里说的网页也能看到，且记忆不再被任一方 create-new-history 清空。共享指针
   由第一个开口的客户端创建并写回；关闭合并时桌宠只建自己的历史（仍会持久化、
   在网页历史列表里可见，只是不并入同一条时间线）。 */
let petShareCfg = null, histPromise = null;

/* Tell the server which chat_history session this client writes to. Because the
   fork's agent memory is ONE object shared by every connection (websocket_handler
   passes agent_engine by reference), fetch-and-set-history also RELOADS that
   memory — so it must run rarely (connect / character change / a real new-chat on
   the other side), never per-poll, and never in the middle of a reply. Serialized
   through histPromise so a connect-time establish and a send never double-fire. */
async function _establishRun() {
  const myConf = state.confUid;
  const r = await fetch("/api/pet", { cache: "no-store" });
  if (!r.ok) return false;
  petShareCfg = (await r.json()).settings || {};
  const shared =
    petShareCfg.shareHistory &&
    petShareCfg.sharedConfUid === myConf &&
    petShareCfg.sharedHistoryUid;
  if (shared) {
    resetMirror();
    state.historyUid = petShareCfg.sharedHistoryUid;
    wsSend({ type: "fetch-and-set-history", history_uid: petShareCfg.sharedHistoryUid });
  } else {
    resetMirror();
    state.historyUid = null;
    wsSend({ type: "create-new-history" });
  }
  // The character may have switched while we awaited; only claim if still ours.
  if (state.confUid === myConf) state.histEstablishedFor = myConf;
  return true;
}

function establishHistory() {
  if (!state.confUid) return Promise.resolve(false);
  if (state.histEstablishedFor === state.confUid) return Promise.resolve(true);
  if (histPromise) return histPromise;
  state.histEstablishedFor = state.confUid; // claim: no duplicate sends
  histPromise = _establishRun()
    .then((ok) => {
      if (!ok) state.histEstablishedFor = ""; // retry next time
      return ok;
    })
    .finally(() => {
      histPromise = null;
    });
  return histPromise;
}

/* Is another live client actually using that character? Only a pointer whose owner
   character has no live client may be taken over, so two clients on two different
   characters stop re-publishing over each other (every re-adoption reloads the ONE
   agent memory object they share — that is what made the pet lag and stall). */
async function characterIsLive(confUid) {
  try {
    const q = state.clientUid ? `?exclude=${encodeURIComponent(state.clientUid)}` : "";
    const r = await fetch("/api/pet/web-character" + q, { cache: "no-store" });
    if (!r.ok) return true; // unknown: be conservative and leave the pointer alone
    const d = await r.json();
    return (d.clients || []).some((c) => c.conf_uid === confUid);
  } catch {
    return true;
  }
}

function publishSharedHistory() {
  if (!petShareCfg || petShareCfg.shareHistory === false) return;
  if (!state.historyUid || !state.confUid) return;
  const owner = petShareCfg.sharedConfUid, ownerUid = petShareCfg.sharedHistoryUid;
  if (ownerUid && owner && owner !== state.confUid) {
    characterIsLive(owner).then((live) => {
      if (live) return;
      petShareCfg = { ...petShareCfg, sharedHistoryUid: state.historyUid, sharedConfUid: state.confUid };
      patchPetSettings({ sharedHistoryUid: state.historyUid, sharedConfUid: state.confUid });
    });
    return;
  }
  petShareCfg = { ...petShareCfg, sharedHistoryUid: state.historyUid, sharedConfUid: state.confUid };
  patchPetSettings({ sharedHistoryUid: state.historyUid, sharedConfUid: state.confUid });
}

/* Adopt a genuine "new chat" from the web. The other side republishing the shared
   pointer means it restarted, so re-point our writes there (which reloads the
   shared memory to the new conversation — correct, and only on a real change).
   The reload is destructive: agent memory is ONE object shared by every connection,
   so a too-early switch throws away the other side's in-flight turn (that is what
   made the pet forget context and stall). Adopt only a pointer that stayed the same
   across two polls, and never right after a turn. */
let adoptCandidate = "", lastTurnTs = 0;

async function adoptSharedHistoryIfChanged() {
  if (!state.connected || !state.confUid) return;
  if (state.speaking || state.thinking) return;
  try {
    const r = await fetch("/api/pet", { cache: "no-store" });
    if (!r.ok) return;
    const s = (await r.json()).settings || {};
    petShareCfg = s;
    if (s.shareHistory === false) return;
    if (s.sharedConfUid !== state.confUid || !s.sharedHistoryUid) return;
    if (s.sharedHistoryUid === state.historyUid) { adoptCandidate = ""; return; }
    if (pendingLocalTail > 0) return; // our own turn is still being written
    if (Date.now() - lastTurnTs < 6000) return;
    if (adoptCandidate !== s.sharedHistoryUid) { adoptCandidate = s.sharedHistoryUid; return; }
    adoptCandidate = "";
    state.histEstablishedFor = ""; // force the switch through establishHistory
    await establishHistory();
  } catch {
    /* backend not ready; retry next tick */
  }
}
setInterval(adoptSharedHistoryIfChanged, 2500);

/* Real-time display sync. The fork streams a single conversation only to the
   client that spoke, so the other side never sees it live. Both clients therefore
   mirror the shared chat_history file when idle; the sig (count + last timestamp)
   keeps an unchanged conversation from touching the log, and the mirrored tail is
   appended rather than rebuilt. */
let mirrorSig = "", mirrorCount = 0, mirrorUid = "";

function resetMirror() {
  mirrorSig = "";
  mirrorCount = 0;
  mirrorUid = "";
  pendingLocalTail = 0;
  localSeen.clear();
}

async function mirrorSharedHistory() {
  if (!state.connected) return;
  if (state.speaking || state.thinking) return; // never disturb a live turn
  if (!state.confUid || !state.historyUid) return;
  if (!petShareCfg || petShareCfg.shareHistory === false) return;
  if (petShareCfg.sharedConfUid !== state.confUid) return;
  if (petShareCfg.sharedHistoryUid !== state.historyUid) return;
  try {
    const q =
      `?conf_uid=${encodeURIComponent(state.confUid)}` +
      `&history_uid=${encodeURIComponent(state.historyUid)}`;
    const r = await fetch("/api/pet/history" + q, { cache: "no-store" });
    if (!r.ok) return;
    const d = await r.json();
    if (!d || d.sig === mirrorSig) return;
    mirrorSig = d.sig;
    syncConversation(d.messages || []);
  } catch {
    /* backend not ready */
  }
}
setInterval(mirrorSharedHistory, 2000);


async function pollWebCharacter() {
  if (state.clientUid && reportedUid !== state.clientUid) {
    reportedUid = state.clientUid;
    // Let the panel-side calls exclude us even without ?exclude=.
    patchPetSettings({ petUid: state.clientUid });
  }
  // While we are thinking or playing a reply, do NOT switch character or reload
  // the model: that interrupts the live conversation chain and makes the backend
  // emit a "conversation chain" error. The next 2s poll re-attempts the follow.
  if (state.speaking || state.thinking) return;
  // Without our own uid the endpoint still falls back to settings.petUid.
  const q = state.clientUid ? `?exclude=${encodeURIComponent(state.clientUid)}` : "";
  try {
    const r = await fetch(`/api/pet/web-character${q}`, { cache: "no-store" });
    if (!r.ok) return;
    const d = await r.json();
    if (!d.following || !d.web || !d.web.filename) return;
    const file = d.web.filename;
    // 跟随网页时形象也必须由网页的角色决定：固定的桌宠形象会让人格换了、
    // 人物却还画着旧的，看上去就是「没有同步」。
    if (modelOverride) {
      modelOverride = "";
      if (lastModelInfo) loadLive2DModel(resolveModel(lastModelInfo));
      patchPetSettings({ model: "" }); // keep settings.json honest about what shows
    }
    const webSig = charSignature(d.web);
    if (charSignature(d.mine) === webSig) {
      followedSig = "";
      if (requestedConfig !== file) {
        requestedConfig = file;
        patchPetSettings({ character: file });
      }
      return;
    }
    if (webSig === followedSig) return; // 已请求，等服务端应用
    followedSig = webSig;
    requestConfig(file);
    patchPetSettings({ character: file });
  } catch {
    /* 后端未就绪，下一轮再试 */
  }
}
setInterval(pollWebCharacter, 2000);

refreshSkins();
if (pet) {
  pet.onSwitchConfig(requestConfig);
  pet.onSwitchModel(applyModelOverride);
  if (pet.onChatVisible) pet.onChatVisible((v) => setChatVisible(v, false));
  if (pet.onBubbleMode) pet.onBubbleMode((v) => setBubbleMode(v, false));
  if (pet.onVoiceReply) pet.onVoiceReply((v) => setVoiceReply(v, false));
  pet.ready();
} else {
  // Browser-open (no Electron): adopt the shared settings so the web panel still
  // drives them; the ✕ button and the right-click menu persist via /api/pet/settings.
  (async () => {
    try {
      const r = await fetch("/api/pet", { cache: "no-store" });
      if (!r.ok) return;
      const s = (await r.json()).settings || {};
      setBubbleMode(s.bubbleMode !== false, false);
      setVoiceReply(s.voiceReply !== false, false);
      setChatVisible(s.chatVisible !== false, false);
    } catch { /* defaults */ }
  })();
}

/* 调试钩子：?mute=1 静音、?say=文本 连接后自动发送（联调用）、?debug=1 布局信息、
   ?model=名称 只换桌宠形象（与设定面板写的是同一个值） */
if (/[?&]mute=1/.test(location.search)) state.muted = true;
const _qModel = (location.search.match(/[?&]model=([^&]+)/) || [])[1];
if (_qModel) applyModelOverride(decodeURIComponent(_qModel));
if (/[?&]debug=1/.test(location.search)) {
  const d = document.createElement("div");
  d.id = "debugHud";
  d.style.cssText = "position:fixed;left:2px;top:2px;z-index:99;font:11px monospace;color:#0f0;background:rgba(0,0,0,.85);padding:4px 6px;pointer-events:none;white-space:pre";
  document.body.appendChild(d);
  setInterval(() => {
    const W = innerWidth, H = innerHeight;
    let m = "no-model";
    if (live2dModel) {
      const b = live2dModel.getLocalBounds();
      const gb = live2dModel.getBounds();
      const im = live2dModel.internalModel || {};
      const tf = im.localTransform || {};
      const mm = im.matrix || {};
      m = `pos=${live2dModel.x.toFixed(0)},${live2dModel.y.toFixed(0)} s=${live2dModel.scale.x.toFixed(3)}\nglb=${gb.x.toFixed(0)},${gb.y.toFixed(0)},${gb.width.toFixed(0)},${gb.height.toFixed(0)}\nmw=${im.width} mh=${im.height} pivot=${live2dModel.pivot?.x?.toFixed(0)},${live2dModel.pivot?.y?.toFixed(0)}\nmtx=(${mm.a?.toFixed(3)},${mm.b?.toFixed(3)},${mm.c?.toFixed(3)},${mm.d?.toFixed(3)},${mm.tx?.toFixed(0)},${mm.ty?.toFixed(0)})\nlt=(${tf.a?.toFixed(3)},${tf.tx?.toFixed(0)},${tf.ty?.toFixed(0)}) wt=(${live2dModel.worldTransform.a?.toFixed(3)},${live2dModel.worldTransform.tx?.toFixed(0)},${live2dModel.worldTransform.ty?.toFixed(0)})`;
    }
    d.textContent = `win=${W}x${H}\n${m}\nws=${state.connected ? "on" : "off"} sp=${state.speaking}`;
    const g = window.__dbgG;
    if (g && live2dModel) {
      const lt = live2dModel.internalModel.localTransform;
      const gb = live2dModel.getBounds();
      g.clear();
      g.lineStyle(2, 0x00ff00);
      g.drawRect(gb.x, gb.y, gb.width, gb.height);
      if (lt) {
        const b = live2dModel.getLocalBounds();
        const wt = live2dModel.worldTransform;
        const q = (x, y) => { const p1 = lt.apply(new PIXI.Point(x, y)); return wt.apply(p1); };
        const p0 = q(b.x, b.y), p1 = q(b.x + b.width, b.y + b.height);
        g.lineStyle(2, 0xffff00);
        g.drawRect(p0.x, p0.y, p1.x - p0.x, p1.y - p0.y);
      }
      g.lineStyle(2, 0xff0000);
      g.drawCircle(live2dModel.x, live2dModel.y, 6);
      // reference squares at known stage coords (top-left / center / bottom-right)
      g.beginFill(0xff0000, 0.9); g.drawRect(0, 0, 24, 24); g.endFill();
      g.beginFill(0x0000ff, 0.9); g.drawRect(W / 2 - 12, H / 2 - 12, 24, 24); g.endFill();
      g.beginFill(0x00ffff, 0.9); g.drawRect(W - 24, H - 24, 24, 24); g.endFill();
    }
  }, 500);
}
const autoSay = new URLSearchParams(location.search).get("say");
if (autoSay) setTimeout(() => wsSend({ type: "text-input", text: autoSay }), 2500);

initPixi();
connectWS();
</script>
